<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <form action="">
            <tr>
                <td><label for="">First Name:</label></td>
                <td colspan="2"><input type="text" placeholder="Elvish" maxlength="50" required></td>
            </tr>
            <tr>
                <td><label for="">Last Name:</label></td>
                <td colspan="2"><input type="text" placeholder="Yadav" maxlength="50" required></td>
            </tr>
            <tr>
                <td><label for="">Email:</label></td>
                <td colspan="2"><input type="email" placeholder="elvishyadav@gmail.com" required></td>
            </tr>
            <tr>
                <td><label for="">Phone Number:</label></td>
                <td colspan="2"><input type="tel" placeholder="78945xxxxx" maxlength="10" pattern="[0-9]{10}" required></td>
            </tr>
            <tr>
                <td><label for="">Gender:</label></td>
                <td><input type="radio" name="gender" required>Male
                <input type="radio" name="gender" required>Female</td>
            </tr>
            <tr>
                <td><label for="">Date Of Birth(DOB):</label></td>
                <td><input type="date" required></td>
            </tr>
            <tr>
                <td><label for="">Address:</label></td>
                <td colspan="1"><textarea name="" id="" rows="7" cols="35"></textarea>
            </tr>
            <tr>
                <td><label for="">City:</label></td>
                <td><input type="text" placeholder="Ahmedabad" maxlength="50" required></td>
            </tr>
            <tr>
                <td><label for="">Pincode:</label></td>
                <td><input type="text" placeholder="382345" maxlength="6" required></td>
            </tr>
            <tr>
                <td><label for="">State:</label></td>
                <td><input type="text" placeholder="Gujarat" maxlength="50" required></td>
            </tr>
            <tr>
                <td><label for="">Country:</label></td>
                <td><input type="text" placeholder="India" maxlength="50" required></td>
            </tr>
            <tr>
                <td><label for="">Hobbies:</label></td>
                <td><input type="checkbox">Drawing
                    <input type="checkbox">Singing
                    <input type="checkbox">Dancing
                    <input type="checkbox">Sketching<br>
                    <input type="checkbox">Other
                    <input type="text" placeholder="Ex. Teaching" maxlength="50" ><br>
                </td>
            </tr>
            <tr>
                <td><label for="">Qaulification:</label></td>
                <td><br>
                    <input type="checkbox">High School(10th)<br>
                    <input type="checkbox">Higher School(12th)<br>
                    <input type="checkbox">Graduation(Bachelors)<br>
                    <input type="checkbox">Post Graduation(Master)<br>
                    <input type="checkbox">Phd<br>
                </td>
            </tr>
            <tr>
                <td><label for="">Course<br> Applied For:</label></td><br>
                <td><br>
                    <input type="checkbox">BCA<br>
                    <input type="checkbox">B.COM<br>
                    <input type="checkbox">B.SC<br>
                    <input type="checkbox">BA<br>
                    <input type="checkbox">MCA<br>
                    <input type="checkbox">M.COM<br>
                    <input type="checkbox">M.SC<br>
                    <input type="checkbox">MA<br>
                </td>
            </tr>
            <tr>
                <td></td>
                <td><br><button type="submit">Submit</button>
                    <input type="reset">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
