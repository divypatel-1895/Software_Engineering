<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style: none;
        }

        ul li {
            display: inline-block;
            background-color: aqua;
            padding: 8px 20px;
            position: relative;
        }

        ul li a {
            text-decoration: none;
            color: rgb(0, 0, 0);
        }

        li::after {
            content: "";
            height: 5px;
            width: 0%;
            background-color: rgb(243, 0, 0);
            position: absolute;
            top: 100%;
            left: 0;
            transition: .5s;
        }

        li:hover::after {
            width: 100%;
        }

        .main {
            width: 350px;
            height: 200px;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBBQ9-aBTfm3ii3xArovYi4zDgPZ4ZPtDdw9LFcCBxwQ&s=10);
            border: 2px solid;
            margin: 50px 50px;
            background-repeat: no-repeat;
            background-size: contain;
            background-size: cover;
            background-size: 100% 100%;
            box-shadow: 0px 0px 20px 10px gray;
            overflow: hidden;
        }


        .right {
            height: 200px;
            width: 350px;
            background-color: rgba(255, 236, 68, 0.5);
            transform: translate(100%, -100%);
            transition: .6s;
        }

        .main:hover .right {
            transform: translate(0%, 0%);
            transition: .6s;
        }

        .left {
            height: 200px;
            width: 350px;
            background-color: rgba(255, 236, 68, 0.5);
            transform: translate(-100%, 0%);
            transition: .6s;
        }

        .main:hover .left {
            transform: translate(0%, -100%);
        }

        .div {
            width: 350px;
            height: 200px;
            background-image: url(https://cdn.pixabay.com/blog/preview/2026/08/04/10-41-44-546_960_720.png);
            border: 2px solid;
            margin: 50px 270px;
            background-repeat: no-repeat;
            background-size: contain;
            background-size: cover;
            background-size: 100% 100%;
            box-shadow: 0px 0px 20px 10px gray;
            overflow: hidden;
        }

        .jamni {
            height: 200px;
            width: 350px;
            background-color: rgba(56, 255, 66, 0.5);
            transform: translate(100%, -100%);
            transition: .6s;
        }

        .div:hover .jamni {
            transform: translate(0%, 0%);
            transition: .6s;
        }

        .dabi {
            height: 200px;
            width: 350px;
            background-color: rgba(56, 255, 66, 0.5);
            transform: translate(-100%, 0%);
            transition: .6s;
        }

        .div:hover .dabi {
            transform: translate(0%, -100%);
        }

        .hoo {
            width: 350px;
            height: 200px;
            background-image: url(https://cdn.pixabay.com/photo/2026/06/18/22/52/nunziog666-sunrise-10338948_960_720.jpg);
            border: 2px solid;
            margin: 50px 500px;
            background-repeat: no-repeat;
            background-size: contain;
            background-size: cover;
            background-size: 100% 100%;
            box-shadow: 0px 0px 20px 10px gray;
            overflow: hidden;
        }

         .upper {
            height: 200px;
            width: 350px;
            background-color:rgba(66, 114, 248, 0.5); 
            transform: translate(100%, -100%);
            transition: .6s;
        }

        .hoo:hover .upper {
            transform: translate(0%, 0%);
            transition: .6s;
        }

        .niche {
            height: 200px;
            width: 350px;
            background-color:rgba(66, 114, 248, 0.5); 
            transform: translate(-100%, 0%);
            transition: .6s;
        }

        .hoo:hover .niche {
            transform: translate(0%, -100%);
        }


    </style>
</head>

<body>
    <ul>
        <li><a href="">Home</a></li>
        <li><a href="">About</a></li>
        <li><a href="">Contact</a></li>
        <li><a href="">Help</a></li>
        <li><a href="">Pages</a></li>
    </ul>
    <div class="main">
        <div class="right"></div>
        <div class="left"></div>
    </div>
    <div class="div">
        <div class="jamni"></div>
        <div class="dabi"></div>
    </div>
    <div class="hoo">
        <div class="upper"></div>
        <div class="niche"></div>
    </div>
</body>

</html>
