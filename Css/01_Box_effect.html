<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            width: 350px;
            height: 200px;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBBQ9-aBTfm3ii3xArovYi4zDgPZ4ZPtDdw9LFcCBxwQ&s=10);
            border: 2px solid;
            margin: 100px auto;
            background-repeat: no-repeat;
            background-size: contain;
            background-size: cover;
            background-size: 100% 100%;
            box-shadow: 0px 0px 20px 10px gray;
            overflow: hidden;
        }
        

        .right {
            height: 200px;
            width: 350px;
            background-color: rgba(153, 141, 141, 0.5);
            transform: translate(100%, -100%);
            transition: .6s;
        }

        .main:hover .right {
            transform: translate(0%, 0%);
            transition: 6s;
        }

        .left {
            height: 200px;
            width: 350px;
            background-color: rgba(153, 141, 141, 0.5);
            transform: translate(-100%, 0%);
            transition: .6s;
        }

        .main:hover .left {
            transform: translate(0%, -100%);
        }

    </style>
</head>

<body>
    <div class="main">
        <div class="right"></div>
        <div class="left"></div>
    </div>
</body>


</html>
